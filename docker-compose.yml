services:
  mongodb:
    image: mongo:latest
    profiles:
      - database-container
    env_file:
      - ./backend/.env
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ping: 1})' --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db:/data/db
  server:
    depends_on:
      mongodb:
        condition: service_healthy
        required: false
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - SERVER_PORT
      - CORS_ALLOWED_URL
      - LOCAL_DATABASE_CONNECTION_STRING
      - CLOUD_DATABASE_CONNECTION_STRING
      - TOKEN_SECRET
      - TOKEN_EXPIRATION
      - GOOGLE_APP_EMAIL
      - GOOGLE_APP_PASSWORD
  client:
    depends_on:
      - server
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5000:80"
volumes:
  db: