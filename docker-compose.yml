version: '3.8'
services:
  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    depends_on:
      - server
    volumes:
      - ./frontend:/app
      - /app/node_modules
  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - SERVER_PORT
      - CORS_ALLOWED_URL
      - DATABASE_CONNECTION_STRING
      - TOKEN_SECRET
      - TOKEN_EXPIRATION
      - GOOGLE_APP_EMAIL
      - GOOGLE_APP_PASSWORD
    volumes:
      - ./backend:/app
      - /app/node_modules
networks:
  default:
    driver: bridge